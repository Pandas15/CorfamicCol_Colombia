<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORFAMILIAS · Convocatorias</title>
<style>
    :root{
        --verde:#77B72A;
        --verde-osc:#1B5E32;
        --verde-prof:#123F22;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{line-height:1.6;color:#333;background:#F6F8F3;}

    header{
        background:linear-gradient(135deg,var(--verde-osc) 0%,var(--verde-prof) 100%);
        box-shadow:0 4px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:1000;
    }
    .container{width:88%;max-width:1100px;margin:auto;}
    .barra{display:flex;align-items:center;gap:.9rem;padding:.75rem 0;}
    .logo-chip{background:#fff;border-radius:12px;padding:5px 8px;display:flex;align-items:center;
        box-shadow:0 2px 8px rgba(0,0,0,.25);}
    .logo-chip img{height:54px;width:auto;display:block;}
    .marca strong{display:block;color:#fff;font-size:1.1rem;letter-spacing:.08em;line-height:1.2;}
    .marca span{display:block;color:rgba(255,255,255,.82);font-size:.72rem;
        letter-spacing:.03em;text-transform:uppercase;}

    main{padding:2.6rem 0 3.5rem;}
    h1{color:var(--verde-prof);font-size:1.8rem;margin-bottom:1.3rem;}

    .conv-card{
        display:block;background:#fff;border-radius:16px;padding:1.6rem 1.8rem;text-decoration:none;color:#333;
        border-left:6px solid var(--verde);box-shadow:0 8px 22px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;
    }
    .conv-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.12);}
    .conv-estado{
        display:inline-block;background:#28a745;color:#fff;font-size:.72rem;font-weight:700;
        letter-spacing:.08em;text-transform:uppercase;padding:.22rem .7rem;border-radius:20px;margin-bottom:.6rem;
    }
    .conv-card h2{color:var(--verde-prof);font-size:1.25rem;margin-bottom:.4rem;}
    .conv-card p{color:#4B5563;font-size:.95rem;}
    .conv-cierre{color:#7a5b00 !important;font-weight:600;margin-top:.4rem !important;}
    .conv-btn{display:inline-block;margin-top:1rem;background:var(--verde);color:#123F22;font-weight:700;
        padding:.6rem 1.3rem;border-radius:24px;font-size:.9rem;}

    .aviso-vacio{
        background:#fff;border-radius:16px;padding:2.4rem 1.8rem;text-align:center;
        border:1px dashed #C9D6C0;box-shadow:0 8px 22px rgba(0,0,0,.05);
    }
    .aviso-vacio h2{color:var(--verde-prof);font-size:1.2rem;margin-bottom:.5rem;}
    .aviso-vacio p{color:#6B7280;font-size:.95rem;}

    footer{background:var(--verde-prof);color:rgba(255,255,255,.8);padding:1.4rem 0;font-size:.85rem;text-align:center;}

    @media(max-width:640px){
        .container{width:92%;}
        .logo-chip img{height:44px;}
        h1{font-size:1.45rem;}
    }
</style>
</head>
<body>

<header>
    <div class="container barra">
        <span class="logo-chip"><img src="logo_corfamilias.png" alt="CORFAMILIAS"></span>
        <span class="marca">
            <strong>CORFAMILIAS</strong>
            <span>Corporación para las Familias de Colombia</span>
        </span>
    </div>
</header>

<main>
    <div class="container">
        <h1>Convocatorias</h1>
        <a class="conv-card" href="postulacion1.html">
            <span class="conv-estado">Abierta</span>
            <h2>Convocatoria 1 — Aguachica (Cesar)</h2>
            <p>Educación Inicial en el Hogar · 6 cargos · 360 cupos</p>
            <p class="conv-cierre">Cierre: por confirmar</p>
            <span class="conv-btn">Ver convocatoria →</span>
        </a>
    </div>
</main>

<footer>
    <div class="container">CORFAMILIAS · Corporación para las Familias de Colombia</div>
</footer>

</body>
</html>
